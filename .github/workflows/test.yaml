name: 08 - Runners

on: workflow_dispatch

jobs:
  linux-job:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect the Linux runner
        run: |
          echo "===== RUNNER INFO ====="
          echo "OS       : $RUNNER_OS"
          echo "Arch     : $RUNNER_ARCH"
          echo "Home     : $HOME"
          echo "Temp dir : $RUNNER_TEMP"
          date

          echo ""
          echo "===== CPU INFO ====="
          lscpu

          echo ""
          echo "===== CPU CORE COUNT ====="
          nproc

          echo ""
          echo "===== CPU USAGE ====="
          top -bn1 | head -20

          echo ""
          echo "===== TOP CPU PROCESSES ====="
          ps aux --sort=-%cpu | head -10

          echo ""
          echo "===== MEMORY ====="
          free -h

          echo ""
          echo "===== DISK ====="
          df -h
