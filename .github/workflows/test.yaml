name: 08 - Runners

on:
  workflow_dispatch:

jobs:
  linux-job:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect Linux Runner
        run: |
          echo "================================"
          echo "        RUNNER INFORMATION"
          echo "================================"

          echo "OS       : $RUNNER_OS"
          echo "Arch     : $RUNNER_ARCH"
          echo "Home     : $HOME"
          echo "Temp dir : $RUNNER_TEMP"
          echo "Hostname : $(hostname)"
          echo "Date     : $(date)"

          echo ""
          echo "================================"
          echo "        CPU INFORMATION"
          echo "================================"

          lscpu

          echo ""
          echo "CPU Cores:"
          nproc

          echo ""
          echo "================================"
          echo "        CPU / PROCESS USAGE"
          echo "================================"

          top -bn1 | head -20

          echo ""
          echo "Top 10 CPU consuming processes:"
          ps aux --sort=-%cpu | head -10

          echo ""
          echo "================================"
          echo "        MEMORY INFORMATION"
          echo "================================"

          free -h

          echo ""
          echo "================================"
          echo "        DISK INFORMATION"
          echo "================================"

          df -h

          echo ""
          echo "================================"
          echo "        NETWORK INFORMATION"
          echo "================================"

          echo "Hostname:"
          hostname

          echo ""
          echo "Network Interfaces:"
          ip addr

          echo ""
          echo "Network Interface Status:"
          ip link

          echo ""
          echo "Routing Table:"
          ip route

          echo ""
          echo "DNS Configuration:"
          cat /etc/resolv.conf

          echo ""
          echo "Listening Ports:"
          ss -tuln

          echo ""
          echo "Current Network Connections:"
          ss -tun

          echo ""
          echo "Public IP:"
          curl -s https://api.ipify.org
          echo

          echo ""
          echo "================================"
          echo "        INSPECTION COMPLETE"
          echo "================================"
